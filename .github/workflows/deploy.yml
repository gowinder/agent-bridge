name: Deploy

on:
  push:
    branches: [develop, main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force:
        description: 忽略版本号检查，强制部署
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      version: ${{ steps.detect.outputs.version }}
      on_main: ${{ steps.maincheck.outputs.on_main }}
      tag_ok: ${{ steps.maincheck.outputs.tag_ok }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history, so the pre-push tip can always be inspected.
          fetch-depth: 0

      - id: detect
        name: 检查版本号是否变化
        run: |
          set -eu
          version=$(node -p "require('./package.json').version ?? ''")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Compare against the tip before this push: a multi-commit push can carry
          # the bump in an earlier commit, where HEAD^ already has the new version.
          before="${{ github.event.before }}"
          base=""
          if [ -n "$before" ] && ! echo "$before" | grep -qE '^0+$' && git cat-file -e "$before^{commit}" 2>/dev/null; then
            base="$before"
          elif git rev-parse --verify --quiet "HEAD^" >/dev/null; then
            base="HEAD^"
          fi
          changed=false
          if [ "${{ inputs.force }}" = "true" ]; then
            changed=true
          elif [ -z "$version" ]; then
            changed=false
          elif [ -z "$base" ]; then
            # No history to compare against; a present version counts as a change.
            changed=true
          else
            git show "$base:package.json" > "$RUNNER_TEMP/previous-package.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/previous-package.json"
            previous=$(node -p "require('$RUNNER_TEMP/previous-package.json').version ?? ''")
            if [ "$previous" != "$version" ]; then changed=true; fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "版本号：$version（对比 $base），变化：$changed"

      - id: maincheck
        name: 检查提交是否已合入 main
        run: |
          set -eu
          # A tag can point at any commit, including develop or an unreviewed branch;
          # production must only ever deploy what reached main through a pull request.
          on_main=false
          if git rev-parse --verify --quiet origin/main >/dev/null && git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            on_main=true
          fi
          echo "on_main=$on_main" >> "$GITHUB_OUTPUT"
          echo "提交 $GITHUB_SHA 在 main 上：$on_main"
          # 推送 tag 的人不一定走过 PR、也不一定 bump 过版本号。tag 必须与
          # package.json 的版本一致，否则任何人都能给 main 上的旧提交打 tag 触发生产部署。
          tag_ok=true
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${GITHUB_REF#refs/tags/v}" != "${{ steps.detect.outputs.version }}" ]; then
            tag_ok=false
          fi
          echo "tag_ok=$tag_ok" >> "$GITHUB_OUTPUT"
          echo "tag 与版本号匹配：$tag_ok（ref ${GITHUB_REF}，版本 ${{ steps.detect.outputs.version }}）"

  preview:
    needs: version
    if: github.ref == 'refs/heads/develop' && needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: preview
    # Only runs that actually deploy join this group, so a version-neutral push
    # cannot cancel a pending release; releases queue instead of cancelling.
    concurrency:
      group: deploy-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: rustup target add wasm32-unknown-unknown

      - run: npm run build:wasm -w @agent-bridge/crypto

      - run: npm run check

      - run: npm run build -w @agent-bridge/web

      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          # 优先用 preview 环境自己的 token：develop 的改动不需要生产部署权限。
          # 回退到共享 token 只是为了让尚未配置环境级 token 的仓库继续能部署。
          apiToken: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/relay
          wranglerVersion: "4.92.0"
          command: deploy --env preview

  production:
    needs: version
    # Tags deploy only when they point at a commit already merged into main;
    # main itself deploys when the version moves. A tag must also carry the
    # package.json version, so an arbitrary tag cannot re-deploy an old commit.
    if: (startsWith(github.ref, 'refs/tags/v') && needs.version.outputs.on_main == 'true' && needs.version.outputs.tag_ok == 'true') || (github.ref == 'refs/heads/main' && needs.version.outputs.changed == 'true')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: rustup target add wasm32-unknown-unknown

      - run: npm run build:wasm -w @agent-bridge/crypto

      - run: npm run check

      - run: npm run build -w @agent-bridge/web

      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          # 生产用 production 环境自己的 token，与 preview 的权限分开。
          apiToken: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/relay
          wranglerVersion: "4.92.0"
          command: deploy
