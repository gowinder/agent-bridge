name = "agent-bridge-relay"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# 生产环境走品牌子域：前端静态资源与 /v1/* 由同一个 Worker 提供，保持同源。
[[routes]]
pattern = "agent-bridge.craftstead.app"
custom_domain = true

[dev]
port = 8787

[durable_objects]
bindings = [{ name = "ROOMS", class_name = "Room" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/v1/*"]

[env.preview]
name = "agent-bridge-preview"
# routes 是可继承键：不显式清空，preview 部署会把这台 Worker 也绑到生产域名上。
routes = []
workers_dev = true

[env.preview.durable_objects]
bindings = [{ name = "ROOMS", class_name = "Room" }]

[[env.preview.migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[env.preview.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/v1/*"]
